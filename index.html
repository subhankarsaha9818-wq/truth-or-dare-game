<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth or Dare - Welcome</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/hero.css">
</head>
<body>
    <div class="hero-container">
        <header class="hero-header">
            <h1>🔥 Truth <span class="amp">or</span> Dare 🔥</h1>
            <p>The ultimate party game, now completely digital. Enter players to begin!</p>
        </header>

        <main class="player-setup-card">
    <h2>Enter Player Names</h2>
    <form id="player-form">
        <div id="dynamic-inputs-container" class="input-list">
            <div class="input-group flex-input">
                <input type="text" class="player-input" required placeholder="Player 1" maxlength="12">
            </div>
            <div class="input-group flex-input">
                <input type="text" class="player-input" required placeholder="Player 2" maxlength="12">
            </div>
        </div>

        <div class="setup-actions">
            <button type="button" id="addPlayerBtn" class="btn btn-secondary">➕ Add Player</button>
            <button type="submit" class="btn btn-primary">Launch Game 🚀</button>
        </div>
    </form>
</main>
    </div>

    <script src="JS/players.js"></script>
    <script src="JS/app.js"></script>
</body>
</html>
